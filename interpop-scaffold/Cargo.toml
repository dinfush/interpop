# │ ⛔ 绝对禁止引入 interpop-render / interpop-atoms / wayland-*。 │
# │ Phase 3 将按 P3-10 Zero-Trace 规程实施物理整目录抹除           │
# │ (SOP-P3 生成时继承本条，PR 编号由 SOP-P3 定义)。                │
# └─────────────────────────────────────────────────────────────────┘

[dependencies]
interpop-core = { path = "../interpop-core", version = "0.1.0" }
serde_json = { workspace = true }

[[bin]]
name = "scaffold-p1"
path = "src/main.rs"