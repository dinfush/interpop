[package]
name = "interpop-scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ┌─────────────────────────────────────────────────────────────────┐
# │ ⚠ 临时脚手架生命周期纪律 (白皮书 §15.3 / SOP-P1 §1.3)          │
# │ 本 crate 仅供 Phase 1 / Phase 2 临时桩驱动与验证使用。          │
# │ 依赖白名单: 严格限定为 interpop-core 与 serde_json 两项。      │
# │ CLI 解析归置裁决: 使用 std::env::args 手写最小解析 (PR-10 参数面│
